user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
}

http {

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 100;
        charset utf-8;
        reset_timedout_connection on;
        types_hash_max_size 2048;
        server_tokens off;

        # gzip
        gzip on;
        gzip_disable "msie6";
        gzip_http_version 1.1;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/javascript application/x-javascript text/xml application/xml application/xml+rss application/vnd.ms-fontobject application/x-font-ttf font/opentype font/x-woff image/svg+xml image/x-icon;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format cache_st '$remote_addr - $upstream_cache_status [$time_local]  '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

        # caching path
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m inactive=60m;
        # The response depends on Origin (the app only sends CORS headers
        # when it is present), so it is part of the key: otherwise a
        # response cached for a request without Origin (curl, Grafana) is
        # served to browsers without Access-Control-Allow-Origin.
        proxy_cache_key "$scheme$proxy_host$request_uri|$http_origin";

        # Requests arrive client -> Cloudflare -> ALB -> nginx, and each
        # proxy appends its peer to X-Forwarded-For, so the last entry is a
        # Cloudflare edge, not the client. Walk X-Forwarded-For from the
        # right skipping trusted proxies (the ALB nodes in the VPC and
        # Cloudflare's ranges, https://www.cloudflare.com/ips/) and use the
        # first untrusted address as the client, so rate limiting below
        # keys on the actual caller. Entries left of it are client-supplied
        # and never used, so a forged X-Forwarded-For can't pick the IP.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # rate limiting: this is a public, unauthenticated API
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_req_status 429;

        server {
              listen        80;
              client_max_body_size 1m;

              #access_log off;
              access_log /dev/stdout cache_st;

              # Health checks must reach the API every time: a cached 200
              # would keep a task with a dead API healthy for up to 15s. Not
              # rate limited either, so a busy health checker never gets 429.
              location = /ping {
                    proxy_pass http://localhost:5005;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_read_timeout 10s;
                    add_header X-Content-Type-Options nosniff always;
              }

              location / {

                    limit_req zone=api_limit burst=20 nodelay;

                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    # CORS is handled entirely by the FastAPI app; do not
                    # duplicate headers here (two Access-Control-Allow-Origin
                    # headers on the same response makes browsers reject it).
                    proxy_redirect off;

                    #Setting up quart port
                    proxy_pass http://localhost:5005;
                    proxy_http_version 1.1;
                    # No websockets here: don't hold upstream connections
                    # open for hours. The API bounds its own DB queries
                    # (APP_MONGO_TIMEOUT_MS, 20s by default) below this.
                    proxy_set_header Connection "";
                    proxy_read_timeout 60s;
                    proxy_send_timeout 60s;

                    #cache: only successful GET/HEAD responses, 15s
                    proxy_cache cache;
                    proxy_cache_methods GET HEAD;
                    proxy_cache_valid 200 15s;
                    add_header X-Proxy-Cache $upstream_cache_status;
                    add_header X-Content-Type-Options nosniff always;

                }

        }
}